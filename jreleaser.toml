[project]
name = "betterbranch"
description = "List git branches from the current repository"
longDescription = "betterbranch is a small CLI for listing branches in the current git repository."
authors = [ "Benjamin Marwell" ]
license = "EUPL-1.2"
inceptionYear = "2026"
stereotype = "CLI"
tags = [ "java", "git", "cli" ]

[project.links]
homepage = "https://github.com/bmarwell/betterbranch"
bugTracker = "https://github.com/bmarwell/betterbranch/issues"
vcsBrowser = "https://github.com/bmarwell/betterbranch"

[release.github]
enabled = true
owner = "bmarwell"
name = "betterbranch"
username = "bmarwell"
update.enabled = true

    [release.github.changelog]
    formatted = "ALWAYS"
    preset = "conventional-commits"
    links = true
    hide.contributors = [ "Benjamin Marwell", "[bot]", "GitHub" ]

# Java archive distribution: plain jar + runtime libs in lib/
[assemble.javaArchive.betterbranch]
active = "ALWAYS"
stereotype = "CLI"
formats = [ "ZIP", "TAR_GZ" ]

    [assemble.javaArchive.betterbranch.options]
    longFileMode = "POSIX"
    bigNumberMode = "POSIX"

    [assemble.javaArchive.betterbranch.java]
    mainClass = "io.github.bmarwell.betterbranch.BetterBranch"

    [assemble.javaArchive.betterbranch.mainJar]
    path = "{{projectDir}}/target/{{projectName}}-{{projectVersion}}.jar"

    [[assemble.javaArchive.betterbranch.fileSets]]
    input = "{{projectDir}}/target/libs"
    output = "lib"
    includes = [ "*.jar" ]

    [[assemble.javaArchive.betterbranch.fileSets]]
    input = "{{projectDir}}"
    output = "./"
    includes = [ "LICENSE*", "README*" ]

[distributions.betterbranch-archive]
type = "JAVA_BINARY"
stereotype = "CLI"

# Native binaries released from tag artifacts
[distributions.betterbranch]
type = "BINARY"
stereotype = "CLI"

    [[distributions.betterbranch.artifacts]]
    path = "{{artifactsDir}}/betterbranch-linux-x86_64"
    platform = "linux-x86_64"
    extraProperties.graalVMNativeImage = true

    [[distributions.betterbranch.artifacts]]
    path = "{{artifactsDir}}/betterbranch-macos-aarch64"
    platform = "osx-aarch_64"
    extraProperties.graalVMNativeImage = true

    [[distributions.betterbranch.artifacts]]
    path = "{{artifactsDir}}/betterbranch-windows-x86_64.exe"
    platform = "windows-x86_64"
    extraProperties.graalVMNativeImage = true
