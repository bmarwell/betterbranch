name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Set up JDK
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v6.0.0
      with:
        java-version: 25
        distribution: 'temurin'
        cache: maven

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.37.8
      with:
        languages: ${{ matrix.language }}
        build-mode: manual
        queries: security-extended

    - name: Build with Maven
      run: ./mvnw --batch-mode --no-transfer-progress --show-version clean package --define native.skip=true --define skipTests

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.37.8
      with:
        category: "/language:${{matrix.language}}"
