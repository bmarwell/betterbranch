name: Build Native

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      head_sha:
        description: The commit SHA to checkout
        required: false
        type: string

jobs:
  build-native:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: macos-aarch64
            os: macos-14
          - target: windows-x64
            os: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 25
          distribution: graalvm
          cache: maven

      - name: Retrieve musl toolchain from cache
        id: musl-toolchain-cache
        if: matrix.target == 'linux-x64'
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.musl-toolchain
          key: betterbranch-musl-toolchain-11

      - name: Get musl toolchain and compile libz against it
        id: prepare-musl
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          echo "Downloading musl toolchain and compiling zlib against it..."
          mkdir -p ~/.musl-toolchain
          pushd ~/.musl-toolchain
          if [ ! -f x86_64-linux-musl-native.tgz ]; then
            curl \
                --silent \
                --show-error \
                --fail-with-body \
                --connect-timeout 5 \
                --max-time 50 \
                --retry 5 \
                --retry-delay 0 \
                --retry-max-time 40 \
                --user "${MUSL_TOOLCHAIN_USER}:${MUSL_TOOLCHAIN_PASS}" \
                --location \
                --remote-name \
                --remote-header-name \
                --url "${MUSL_TOOLCHAIN_LOCATION}/11/x86_64-linux-musl-native.tgz"
          fi
          popd

          TMP_DIR=$(mktemp -d)
          pushd "$TMP_DIR"
          tar -xf ~/.musl-toolchain/x86_64-linux-musl-native.tgz

          echo "Downloading and compiling zlib 1.3..."
          # zlib.net is a small, occasionally flaky single-server mirror that sometimes
          # serves an error page with HTTP 200 to CI/datacenter IPs, so fall back to the
          # GitHub-hosted release asset if the primary download isn't a valid gzip file.
          for ZLIB_URL in "https://zlib.net/fossils/zlib-1.3.tar.gz" "https://github.com/madler/zlib/releases/download/v1.3/zlib-1.3.tar.gz"; do
            echo "Trying ${ZLIB_URL}..."
            curl \
                --silent \
                --show-error \
                --fail-with-body \
                --connect-timeout 5 \
                --max-time 50 \
                --retry 5 \
                --retry-delay 0 \
                --retry-max-time 40 \
                --location \
                --output zlib-1.3.tar.gz \
                "${ZLIB_URL}"
            if gzip -t zlib-1.3.tar.gz 2>/dev/null; then
              break
            fi
            echo "Downloaded file from ${ZLIB_URL} is not a valid gzip archive, trying next mirror..."
            rm -f zlib-1.3.tar.gz
          done
          if [ ! -f zlib-1.3.tar.gz ]; then
            echo "Failed to download a valid zlib-1.3.tar.gz from any mirror" >&2
            exit 1
          fi
          tar -xzf zlib-1.3.tar.gz
          cd zlib-1.3

          TOOLCHAIN_DIR="$TMP_DIR/x86_64-linux-musl-native"
          CC="$TOOLCHAIN_DIR/bin/gcc"
          export CC

          echo "Configuring and installing zlib..."
          ./configure --prefix="$TOOLCHAIN_DIR" --static
          make
          make install

          echo "Prepared musl toolchain at $TOOLCHAIN_DIR"
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> "$GITHUB_OUTPUT"
        env:
          MUSL_TOOLCHAIN_LOCATION: ${{ secrets.MUSL_TOOLCHAIN_LOCATION }}
          MUSL_TOOLCHAIN_USER: ${{ secrets.MUSL_TOOLCHAIN_USER }}
          MUSL_TOOLCHAIN_PASS: ${{ secrets.MUSL_TOOLCHAIN_PASS }}

      - name: Save musl toolchain to cache
        if: matrix.target == 'linux-x64' && steps.musl-toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.musl-toolchain
          key: betterbranch-musl-toolchain-11

      - name: Build native executable
        shell: bash
        run: |
          if [ -n "${TOOLCHAIN_DIR}" ]; then
            PATH="${TOOLCHAIN_DIR}/bin:${PATH}"
            export PATH
          fi
          ./mvnw --batch-mode --show-version --strict-checksums --errors --no-transfer-progress package
        env:
          TOOLCHAIN_DIR: ${{ steps.prepare-musl.outputs.TOOLCHAIN_DIR }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: artifacts-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/betterbranch*
            target/*.jar
