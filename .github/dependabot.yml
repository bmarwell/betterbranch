version: 2
cooldown:
  default-days: 7
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    groups:
      monthly-batch:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      monthly-batch:
        patterns:
          - "*"
