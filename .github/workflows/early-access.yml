name: Publish Early Access builds

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

    steps:
      - name: Download native binary artifacts from Build workflow
        uses: dawidd6/action-download-artifact@v21
        with:
          run_id: ${{ github.event.workflow_run.id }}
          path: /tmp/artifacts
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move build artifacts to correct folder
        shell: bash
        run: |
          mkdir -p artifacts
          find /tmp/artifacts -type f -exec mv -v {} artifacts/ \;
          if ! find artifacts -type f -print -quit | grep -q .; then
            echo "ERROR: No build artifacts downloaded."
            exit 1
          fi

      - name: Publish rolling early access release
        shell: bash
        run: |
          if gh release view early-access >/dev/null 2>&1; then
            gh release delete early-access --yes --cleanup-tag
          fi
          gh release create early-access artifacts/* \
            --prerelease \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "Early Access" \
            --notes "Automated early access build for ${{ github.event.workflow_run.head_sha }}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
